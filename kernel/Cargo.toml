[package]
name = "goban-kernel"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
encoding_rs = "0.8.42"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-minimal-protocol = "0.2"
zune-core = { version = "0.5", default-features = false }
zune-jpeg = { version = "0.5", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
